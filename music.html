<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Width Gallery</title>
    <style>
        :root {
            /* 告訴瀏覽器這是一個深色網頁，避免給出預設白底 */
            color-scheme: dark; 
        }
        html, body {
            /* 確保外層容器也是滿的 */
            width: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: transparent;
            display: flex;
            flex-direction: column;
            /* 🏆 關鍵修改：移除置中，讓它自然撐滿寬度 */
            /* align-items: center; <-- 刪除 */
            align-items: center;
            /* 間距維持 */
            gap: 35px;
            
            /* 讓高度自動適應內容 */
            height: auto;
            box-sizing: border-box;
        }

        .frame-container {
            /* 🏆 關鍵修改：寬度設為 100%，填滿 Notion 給的空間 */
            width: 100%; 
            display: block; /* 改為 block 讓它自然佔滿一行 */
            cursor: pointer;
            transition: transform 0.3s ease;
            margin: 0;
            position: relative; /* 為絕對定位的播放器做準備 */
        }

        .frame-container:hover {
            transform: translateY(-3px); 
        }

        .art-frame {
            width: 100%;
            /* 🏆 關鍵修改：高度設為自動，依圖片比例調整 */
            height: auto; 
            
            position: relative;
            border: none;
            box-shadow: none;
            background-color: transparent;
            display: block;
        }

        .painting-img {
            /* 🏆 關鍵修改：圖片寬度 100%，高度自動 */
            width: 100%;
            height: auto;
            
            /* 移除 object-fit，因為現在是自然撐滿 */
            
            /* 維持復古濾鏡 */
            filter: sepia(15%) contrast(1.1) brightness(0.9);
            transition: opacity 0.5s ease;
            
            border: none;
            box-shadow: none;
            display: block; /* 消除底部縫隙 */
        }

        /* YouTube 播放器容器 - 需要一個技巧來維持比例 */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .music-player {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000; 
        }

        /* 播放狀態控制 */
        .playing .painting-img { opacity: 0; pointer-events: none; }
        .playing .video-container { display: block; }
    </style>
</head>
<body>

    <div class="frame-container" onclick="playMusic(this, 'CfPxlb8-ZQ0')">
        <img class="painting-img" src="./figures/focus.png" alt="Focus">
        <div class="video-container">
            <iframe class="music-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <div class="frame-container" onclick="playMusic(this, 'VUQfT3gNT3g')">
        <img class="painting-img" src="./figures/relaxation.png" alt="Relaxation">
        <div class="video-container">
            <iframe class="music-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function playMusic(element, videoId) {
            // 結構改變，抓取的元素也要微調
            const videoContainer = element.querySelector('.video-container');
            const iframe = videoContainer.querySelector('.music-player');
            
            if (element.classList.contains('playing')) return;
            
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1&modestbranding=1&rel=0`;
            element.classList.add('playing');
        }
    </script>
</body>
</html>
