<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINANCE DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: '#FF7A00', darkBg: '#050505', cardBg: '#09090B' }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        /* 🔥 核心魔法：定義大腦（CSS 變數），讓 Canva 面板可以動態改寫它們 */
        :root {
            /* 粉紅卡動態參數 (預設幫你調得更粉、更冷玫瑰色) */
            --pink-bg-start: #6E2A4A;      /* 更粉的主調 */
            --pink-bg-end: #25101A;        /* 深粉底色 */
            --pink-glow: rgba(235, 64, 140, 0.35); /* 強烈冷粉紅外發光 */
            
            /* 橘色卡動態參數 */
            --orange-bg-start: #5A3C1F;
            --orange-bg-end: #1C1007;
            --orange-glow: rgba(255, 122, 0, 0.25);
        }

        @layer utilities {
            /* 字體發光層次 */
            .text-glow {
                text-shadow: 0 0 12px rgba(255,255,255,0.4), 0 0 24px rgba(255,255,255,0.2);
            }

            /* 噪點質地 */
            .noise-bg::after {
                content: "";
                position: absolute;
                inset: 0;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
                opacity: 0.05; 
                pointer-events: none;
                mix-blend-mode: overlay;
                z-index: 5;
            }

            /* 動態粉紅卡 */
            .glass-pink {
                background: 
                    radial-gradient(circle at top left, var(--pink-glow) 0%, transparent 60%),
                    linear-gradient(145deg, var(--pink-bg-start) 0%, var(--pink-bg-end) 100%);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-radius: 24px;
                position: relative;
                overflow: hidden;
                box-shadow: 
                    inset 0 1px 0 rgba(255, 255, 255, 0.3),
                    inset 0 -1px 0 rgba(255, 255, 255, 0.05),
                    0 15px 35px -5px rgba(0, 0, 0, 0.6),
                    0 0 40px 0 var(--pink-glow);
            }
            .glass-pink::before {
                content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1.5px;
                background: linear-gradient(90deg, rgba(255, 255, 255, 0.9), var(--pink-glow), transparent 70%);
                z-index: 2;
            }
            .glass-pink::after {
                content: ''; position: absolute; top: 0; left: 0; width: 1.5px; height: 100%;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), var(--pink-glow), transparent 70%);
                z-index: 2;
            }

            /* 動態橘色卡 */
            .glass-orange {
                background: 
                    radial-gradient(circle at top right, var(--orange-glow) 0%, transparent 60%),
                    linear-gradient(145deg, var(--orange-bg-start) 0%, var(--orange-bg-end) 100%);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-radius: 24px;
                position: relative;
                overflow: hidden;
                box-shadow: 
                    inset 0 1px 0 rgba(255, 255, 255, 0.3),
                    inset 0 -1px 0 rgba(255, 255, 255, 0.05),
                    0 15px 35px -5px rgba(0, 0, 0, 0.6),
                    0 0 40px 0 var(--orange-glow);
            }
            .glass-orange::before {
                content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1.5px;
                background: linear-gradient(270deg, rgba(255, 255, 255, 0.9), var(--orange-glow), transparent 70%);
                z-index: 2;
            }
            .glass-orange::after {
                content: ''; position: absolute; top: 0; right: 0; width: 1.5px; height: 100%;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), var(--orange-glow), transparent 70%);
                z-index: 2;
            }
        }
    </style>
</head>
<body class="bg-darkBg text-gray-300 min-h-screen flex font-sans selection:bg-brand/30">

    <aside class="w-64 h-screen bg-darkBg border-r border-white/5 p-6 flex flex-col justify-between sticky top-0">
        <nav class="space-y-2 mt-4" id="sidebar-nav">
            <a href="#" data-target="page-overview" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl bg-cardBg text-brand border border-orange-500/10 font-semibold transition-all duration-200">
                <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z"></path></svg>
                <span>Overview</span>
            </a>
            <a href="#" data-target="page-transactions" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-neutral-500 hover:bg-white/5 transition-all duration-200">
                <svg class="w-5 h-5 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                <span>Transactions</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto space-y-10">
        
        <div id="page-overview" class="content-page space-y-10">
            
            <section class="max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="glass-pink p-8 min-h-[220px] flex flex-col justify-between transition-transform hover:-translate-y-1 duration-300 noise-bg">
                    <div class="relative z-10">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-sm font-medium text-[#E5C3D5] tracking-wide">Monthly Expense</span>
                            <div id="trend-icon"></div>
                        </div>
                        <div>
                            <div id="expense-amount" class="text-5xl font-black text-white mb-2 tracking-tighter text-glow animate-pulse">Loading...</div>
                            <div id="mom-text" class="text-sm font-semibold text-[#D4B6BB]">Calculating...</div>
                        </div>
                    </div>
                </div>

                <div class="glass-orange p-8 min-h-[220px] flex flex-col justify-between transition-transform hover:-translate-y-1 duration-300 noise-bg">
                    <div class="relative z-10">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-sm font-medium text-[#E6D5B8] tracking-wide">Available Balance</span>
                            <svg class="w-6 h-6 text-[#FFC850]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div>
                            <div id="balance-amount" class="text-5xl font-black text-white mb-2 tracking-tighter text-glow animate-pulse">Loading...</div>
                            <div class="text-sm font-semibold text-[#FFC850]/80">Liquid Funds</div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="max-w-4xl p-6 rounded-3xl bg-neutral-900/40 border border-white/5 backdrop-blur-md space-y-6">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><circle cx="12" cy="12" r="3" stroke-width="2"></circle></svg>
                    <h3 class="text-md font-bold text-white tracking-wide">Card Theme Customizer (Canva Mode)</h3>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm">
                    <div class="p-4 rounded-2xl bg-black/40 border border-white/5 space-y-4">
                        <span class="font-semibold text-[#E460B0]">Expense Card Customizer</span>
                        <div class="flex gap-6 items-center">
                            <div class="flex flex-col gap-1.5">
                                <label class="text-xs text-neutral-400">Glow/Neon Color</label>
                                <input type="color" id="pink-glow-picker" value="#d23cca" class="w-12 h-8 rounded-lg bg-transparent border-0 cursor-pointer">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-xs text-neutral-400">Gradient Start</label>
                                <input type="color" id="pink-start-picker" value="#6e2a4a" class="w-12 h-8 rounded-lg bg-transparent border-0 cursor-pointer">
                            </div>
                        </div>
                    </div>

                    <div class="p-4 rounded-2xl bg-black/40 border border-white/5 space-y-4">
                        <span class="font-semibold text-[#FF7A00]">Balance Card Customizer</span>
                        <div class="flex gap-6 items-center">
                            <div class="flex flex-col gap-1.5">
                                <label class="text-xs text-neutral-400">Glow/Neon Color</label>
                                <input type="color" id="orange-glow-picker" value="#ff7a00" class="w-12 h-8 rounded-lg bg-transparent border-0 cursor-pointer">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-xs text-neutral-400">Gradient Start</label>
                                <input type="color" id="orange-start-picker" value="#5a3c1f" class="w-12 h-8 rounded-lg bg-transparent border-0 cursor-pointer">
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        
        <div id="page-transactions" class="content-page space-y-4 hidden">
            <h2 class="text-xl font-bold text-white tracking-wide">Transactions Ledger</h2>
        </div>
    </main>

    <script>
        // 1. 分頁切換
        const navItems = document.querySelectorAll('.nav-item');
        const contentPages = document.querySelectorAll('.content-page');
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                navItems.forEach(nav => {
                    nav.className = "nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-neutral-500 hover:bg-white/5 transition-all duration-200";
                });
                item.className = "nav-item flex items-center gap-3 px-4 py-3 rounded-xl bg-cardBg text-brand border border-orange-500/10 font-semibold transition-all duration-200";
                contentPages.forEach(p => p.classList.add('hidden'));
                document.getElementById(item.getAttribute('data-target')).classList.remove('hidden');
            });
        });

        // 🛠️ 🔥 2. CANVA 核心即時監聽與控制（將選色器的十六進位轉換並寫入 CSS 變數）
        // 輔助函式：將 Hex 轉為帶透明度的 rgba，確保漫射與外暈不會死硬
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        // 輔助函式：自動生成深色調尾端漸層，避免死黑或不搭的顏色
        function darkenColor(hex) {
            let r = Math.max(0, parseInt(hex.slice(1, 3), 16) - 50);
            let g = Math.max(0, parseInt(hex.slice(3, 5), 16) - 50);
            let b = Math.max(0, parseInt(hex.slice(5, 7), 16) - 50);
            return `rgb(${r}, ${g}, ${b})`;
        }

        // 監聽 Expense 卡控制
        document.getElementById('pink-glow-picker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--pink-glow', hexToRgba(e.target.value, 0.3));
        });
        document.getElementById('pink-start-picker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--pink-bg-start', e.target.value);
            document.documentElement.style.setProperty('--pink-bg-end', darkenColor(e.target.value));
        });

        // 監聽 Balance 卡控制
        document.getElementById('orange-glow-picker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--orange-glow', hexToRgba(e.target.value, 0.25));
        });
        document.getElementById('orange-start-picker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--orange-bg-start', e.target.value);
            document.documentElement.style.setProperty('--orange-bg-end', darkenColor(e.target.value));
        });


        // 3. 獲取 API 數據邏輯
        async function fetchExpenseData() {
            const amountEl = document.getElementById('expense-amount');
            const momEl = document.getElementById('mom-text');
            const iconEl = document.getElementById('trend-icon');
            try {
                const res = await fetch('/api/get-expense');
                const data = await res.json();
                if (data.total !== undefined) {
                    amountEl.classList.remove('animate-pulse');
                    amountEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    momEl.classList.remove('animate-pulse');
                    const formattedMom = Math.abs(data.mom).toFixed(1);
                    const upArrow = `<svg class="w-6 h-6 text-[#E460B0]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>`;
                    const downArrow = `<svg class="w-6 h-6 text-[#76A88A]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>`;
                    if (data.mom > 0) {
                        momEl.innerText = `(+${formattedMom}% MoM)`;
                        momEl.className = 'text-sm font-semibold text-[#E460B0]';
                        iconEl.innerHTML = upArrow;
                    } else if (data.mom < 0) {
                        momEl.innerText = `(-${formattedMom}% MoM)`;
                        momEl.className = 'text-sm font-semibold text-[#76A88A]';
                        iconEl.innerHTML = downArrow;
                    } else {
                        momEl.innerText = `(0.0% MoM)`;
                        momEl.className = 'text-sm font-semibold text-neutral-500';
                        iconEl.innerHTML = ''; 
                    }
                }
            } catch (e) { amountEl.innerText = '讀取錯誤'; }
        }

        async function fetchBalanceData() {
            const balanceEl = document.getElementById('balance-amount');
            try {
                const res = await fetch('/api/get-balance');
                const data = await res.json();
                if (data.total !== undefined) {
                    balanceEl.classList.remove('animate-pulse');
                    balanceEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                } else { balanceEl.innerText = '讀取錯誤'; }
            } catch (e) { balanceEl.innerText = '連線失敗'; }
        }

        fetchExpenseData();
        fetchBalanceData();
    </script>
</body>
</html>
