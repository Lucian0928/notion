<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINANCE DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    // 🔥 關鍵 1：背景改為純粹的黑，這是凸顯漸層透光邊框的秘密
                    colors: { brand: '#FF7A00', darkBg: '#000000', cardBg: '#0F0F0F' }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-300 min-h-screen flex font-sans selection:bg-brand/30">

    <aside class="w-64 h-screen bg-darkBg border-r border-white/5 p-6 flex flex-col justify-between sticky top-0">
        <nav class="space-y-2 mt-4" id="sidebar-nav">
            <a href="#" data-target="page-overview" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl bg-cardBg text-brand border border-orange-500/10 font-semibold transition-all duration-200">
                <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z"></path></svg>
                <span>Overview</span>
            </a>
            <a href="#" data-target="page-transactions" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-neutral-500 hover:bg-white/5 transition-all duration-200">
                <svg class="w-5 h-5 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                <span>Transactions</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <div id="page-overview" class="content-page space-y-8">
            
            <section class="max-w-3xl grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <div class="relative p-[1px] rounded-[24px] bg-gradient-to-b from-white/20 via-white/5 to-transparent shadow-[0_15px_40px_-10px_rgba(255,43,109,0.15)] group">
                    <div class="relative h-full w-full rounded-[23px] bg-[#0A0A0A] p-6 overflow-hidden">
                        
                        <div class="absolute -top-[80px] -left-[20px] w-[200px] h-[200px] bg-[#FF2B6D]/20 blur-[50px] rounded-full pointer-events-none group-hover:bg-[#FF2B6D]/30 transition-colors duration-500"></div>
                        
                        <div class="relative z-10 flex flex-col justify-between h-full">
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-sm font-medium text-neutral-400">Monthly Expense</span>
                                <div id="trend-icon"></div>
                            </div>
                            <div>
                                <div id="expense-amount" class="text-4xl font-bold text-white mb-1 tracking-tight animate-pulse">Loading...</div>
                                <div id="mom-text" class="text-sm font-medium text-neutral-500">Calculating...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="relative p-[1px] rounded-[24px] bg-gradient-to-b from-white/20 via-white/5 to-transparent shadow-[0_15px_40px_-10px_rgba(255,122,0,0.15)] group">
                    <div class="relative h-full w-full rounded-[23px] bg-[#0A0A0A] p-6 overflow-hidden">
                        
                        <div class="absolute -top-[80px] -left-[20px] w-[200px] h-[200px] bg-[#FF7A00]/20 blur-[50px] rounded-full pointer-events-none group-hover:bg-[#FF7A00]/30 transition-colors duration-500"></div>
                        
                        <div class="relative z-10 flex flex-col justify-between h-full">
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-sm font-medium text-neutral-400">Available Balance</span>
                                <svg class="w-5 h-5 text-[#FF7A00]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                            <div>
                                <div id="balance-amount" class="text-4xl font-bold text-white mb-1 tracking-tight animate-pulse">Loading...</div>
                                <div class="text-sm font-medium text-[#FF7A00]/80">Liquid Funds</div>
                            </div>
                        </div>
                    </div>
                </div>

            </section>
        </div>
        
        <div id="page-transactions" class="content-page space-y-4 hidden">
            <h2 class="text-xl font-bold text-white tracking-wide">Transactions Ledger</h2>
        </div>
    </main>

    <script>
        const navItems = document.querySelectorAll('.nav-item');
        const contentPages = document.querySelectorAll('.content-page');
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                navItems.forEach(nav => {
                    nav.className = "nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-neutral-500 hover:bg-white/5 transition-all duration-200";
                });
                item.className = "nav-item flex items-center gap-3 px-4 py-3 rounded-xl bg-cardBg text-brand border border-orange-500/10 font-semibold transition-all duration-200";
                contentPages.forEach(p => p.classList.add('hidden'));
                document.getElementById(item.getAttribute('data-target')).classList.remove('hidden');
            });
        });

        async function fetchExpenseData() {
            const amountEl = document.getElementById('expense-amount');
            const momEl = document.getElementById('mom-text');
            const iconEl = document.getElementById('trend-icon');
            
            try {
                const res = await fetch('/api/get-expense');
                const data = await res.json();
                
                if (data.total !== undefined) {
                    amountEl.classList.remove('animate-pulse');
                    amountEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    
                    momEl.classList.remove('animate-pulse');
                    const formattedMom = Math.abs(data.mom).toFixed(1);

                    const upArrow = `<svg class="w-5 h-5 text-[#D46F7B]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>`;
                    const downArrow = `<svg class="w-5 h-5 text-[#76A88A]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>`;

                    if (data.mom > 0) {
                        momEl.innerText = `(+${formattedMom}% MoM)`;
                        momEl.className = 'text-sm font-medium text-[#D46F7B]';
                        iconEl.innerHTML = upArrow;
                    } else if (data.mom < 0) {
                        momEl.innerText = `(-${formattedMom}% MoM)`;
                        momEl.className = 'text-sm font-medium text-[#76A88A]';
                        iconEl.innerHTML = downArrow;
                    } else {
                        momEl.innerText = `(0.0% MoM)`;
                        momEl.className = 'text-sm font-medium text-neutral-500';
                        iconEl.innerHTML = ''; 
                    }
                }
            } catch (e) {
                amountEl.innerText = '讀取錯誤';
                momEl.innerText = 'N/A';
            }
        }

        async function fetchBalanceData() {
            const balanceEl = document.getElementById('balance-amount');
            try {
                const res = await fetch('/api/get-balance');
                const data = await res.json();
                
                if (data.total !== undefined) {
                    balanceEl.classList.remove('animate-pulse');
                    balanceEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                } else {
                    balanceEl.innerText = '讀取錯誤';
                }
            } catch (e) {
                balanceEl.innerText = '連線失敗';
            }
        }

        fetchExpenseData();
        fetchBalanceData();
    </script>
</body>
</html>
