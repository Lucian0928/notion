<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINANCE DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: '#FF7A00', darkBg: '#0D0E12', cardBg: '#191919' }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-300 min-h-screen flex font-sans">

    <aside class="w-64 h-screen bg-darkBg border-r border-neutral-800 p-6 flex flex-col justify-between sticky top-0">
        <div>
            <nav class="space-y-2 mt-4" id="sidebar-nav">
                <a href="#" data-target="page-overview" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl bg-cardBg text-brand border border-orange-500/10 font-semibold transition-all duration-200 shadow-[0_0_10px_rgba(255,122,0,0.1)]">
                    <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z"></path></svg>
                    <span>Overview</span>
                </a>
                <a href="#" data-target="page-transactions" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-neutral-400 hover:bg-neutral-800/60 transition-all duration-200">
                    <svg class="w-5 h-5 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    <span>Transactions</span>
                </a>
            </nav>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <div id="page-overview" class="content-page space-y-8">
            
            <section class="max-w-2xl grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div class="relative p-5 rounded-2xl bg-gradient-to-b from-[#482B30] to-[#392226] border border-[#88424E] shadow-xl">
                    <div class="flex justify-between items-center mb-2.5">
                        <span class="text-[14px] font-medium text-[#B29CA0]">Monthly Expense</span>
                        <div id="trend-icon" class="text-[#B29CA0]"><div class="w-5 h-5 animate-pulse bg-neutral-700 rounded-full"></div></div>
                    </div>
                    <div id="expense-amount" class="text-[34px] font-bold text-white mb-1 animate-pulse">Loading...</div>
                    <div id="mom-text" class="text-[13px] font-medium text-[#B29CA0] animate-pulse">Calculating...</div>
                </div>

                <div class="relative p-5 rounded-2xl bg-gradient-to-b from-[#332A1D] to-[#1F1B16] border border-[#5D4E36] shadow-xl">
                    <div class="flex justify-between items-center mb-2.5">
                        <span class="text-[14px] font-medium text-[#BCA683]">Available Balance</span>
                        <svg class="w-5 h-5 text-[#E6B97A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div id="balance-amount" class="text-[34px] font-bold text-white mb-1 animate-pulse">Loading...</div>
                    <div class="text-[13px] font-medium text-[#E6B97A]">Liquid Funds</div>
                </div>

            </section>
        </div>
        
        <div id="page-transactions" class="content-page space-y-4 hidden">
            <h2 class="text-xl font-bold text-white tracking-wide">Transactions Ledger</h2>
        </div>
    </main>

    <script>
        // 分頁切換 (保持原邏輯)
        const navItems = document.querySelectorAll('.nav-item');
        const contentPages = document.querySelectorAll('.content-page');
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                contentPages.forEach(p => p.classList.add('hidden'));
                document.getElementById(item.getAttribute('data-target')).classList.remove('hidden');
            });
        });

        // 獲取支出數據
        async function fetchExpenseData() {

const amountElement = document.getElementById('expense-amount');

const momElement = document.getElementById('mom-text');

const trendIcon = document.getElementById('trend-icon');


try {

const response = await fetch('/api/get-expense');

const data = await response.json();


if (data.total !== undefined) {

// 更新主金額

amountElement.classList.remove('animate-pulse');

amountElement.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });


// 移除 MoM 的載入動畫

momElement.classList.remove('animate-pulse');


// 定義兩折線箭頭的 SVG

const upArrowSvg = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>`;

const downArrowSvg = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>`;


const formattedMom = Math.abs(data.mom).toFixed(1);



if (data.mom > 0) {

// 超支：粉紅色 + 向上折線箭頭

momElement.innerText = `(+${formattedMom}% MoM)`;

momElement.className = 'text-[13px] font-medium text-[#D46F7B]';

trendIcon.className = 'text-[#D46F7B]';

trendIcon.innerHTML = upArrowSvg;

} else if (data.mom < 0) {

// 省錢：莫蘭迪綠色 + 向下折線箭頭

momElement.innerText = `(-${formattedMom}% MoM)`;

momElement.className = 'text-[13px] font-medium text-[#76A88A]';

trendIcon.className = 'text-[#76A88A]';

trendIcon.innerHTML = downArrowSvg;

} else {

// 持平：原中性色

momElement.innerText = `(0.0% MoM)`;

momElement.className = 'text-[13px] font-medium text-[#B29CA0]';

trendIcon.className = 'text-[#B29CA0]';

// 橫線箭頭

trendIcon.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;

}

} else {

amountElement.innerText = '讀取錯誤';

momElement.innerText = 'N/A';

}

} catch (error) {

amountElement.innerText = '連線失敗';

momElement.innerText = 'N/A';

}

}



fetchExpenseData();
        fetchBalanceData();
    </script>
</body>
</html>
