<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINANCE DASHBOARD - PRO EDITOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: '#FF7A00', darkBg: '#050505', cardBg: '#09090B' }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        /* 🔥 Figma 級別的動態 CSS 變數系統 */
        :root {
            /* 全局噪點 */
            --noise-op: 0.04;

            /* Card 1 (Expense) 參數 */
            --c1-color: #e83893;
            --c1-glow-op: 20%;
            --c1-spread: 50px;
            --c1-inner-op: 15%;
            --c1-edge-op: 80%;
            --c1-blur: 20px;
            --c1-bg-op: 90%;

            /* Card 2 (Balance) 參數 */
            --c2-color: #ff9d00;
            --c2-glow-op: 20%;
            --c2-spread: 50px;
            --c2-inner-op: 15%;
            --c2-edge-op: 80%;
            --c2-blur: 20px;
            --c2-bg-op: 90%;
        }

        @layer utilities {
            .text-glow {
                text-shadow: 0 0 12px rgba(255,255,255,0.4), 0 0 24px rgba(255,255,255,0.2);
            }

            .noise-bg::after {
                content: ""; position: absolute; inset: 0;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
                opacity: var(--noise-op); 
                pointer-events: none; mix-blend-mode: overlay; z-index: 5;
            }

            /* --- 可編輯卡片共用效果 --- */
            .editable-card {
                cursor: pointer;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .editable-card:hover {
                transform: translateY(-4px) scale(1.01);
            }
            /* Hover 時顯示編輯提示 */
            .editable-card::before {
                content: "Click to Edit Design";
                position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                background: rgba(255,255,255,0.1); backdrop-filter: blur(8px);
                padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; color: white;
                opacity: 0; transition: opacity 0.2s; z-index: 20; pointer-events: none;
                border: 1px solid rgba(255,255,255,0.2);
            }
            .editable-card:hover::before { opacity: 1; }

            /* --- Card 1 (Expense) --- */
            .card-c1 {
                background: color-mix(in srgb, #000 var(--c1-bg-op), transparent);
                backdrop-filter: blur(var(--c1-blur)); -webkit-backdrop-filter: blur(var(--c1-blur));
                border-radius: 24px; position: relative; overflow: hidden;
                box-shadow: 
                    inset 0 1px 1px rgba(255, 255, 255, 0.05), /* 極細內高光 */
                    0 15px 35px -5px rgba(0, 0, 0, 0.8), /* 深度陰影 */
                    0 0 var(--c1-spread) 0 color-mix(in srgb, var(--c1-color) var(--c1-glow-op), transparent); /* 動態外光暈 */
            }
            /* 內部漫射光 (左上角) */
            .card-c1-inner {
                position: absolute; inset: 0; pointer-events: none; z-index: 1;
                background: radial-gradient(circle at top left, color-mix(in srgb, var(--c1-color) var(--c1-inner-op), transparent), transparent 60%);
            }
            /* 邊緣極致切線 (左上角) */
            .card-c1-edge {
                position: absolute; inset: 0; pointer-events: none; z-index: 2; border-radius: 24px;
                border-top: 1.5px solid color-mix(in srgb, var(--c1-color) var(--c1-edge-op), transparent);
                border-left: 1.5px solid color-mix(in srgb, var(--c1-color) calc(var(--c1-edge-op) / 2), transparent);
                mask-image: linear-gradient(135deg, black 0%, transparent 50%);
                -webkit-mask-image: linear-gradient(135deg, black 0%, transparent 50%);
            }

            /* --- Card 2 (Balance) --- */
            .card-c2 {
                background: color-mix(in srgb, #000 var(--c2-bg-op), transparent);
                backdrop-filter: blur(var(--c2-blur)); -webkit-backdrop-filter: blur(var(--c2-blur));
                border-radius: 24px; position: relative; overflow: hidden;
                box-shadow: 
                    inset 0 1px 1px rgba(255, 255, 255, 0.05),
                    0 15px 35px -5px rgba(0, 0, 0, 0.8),
                    0 0 var(--c2-spread) 0 color-mix(in srgb, var(--c2-color) var(--c2-glow-op), transparent);
            }
            /* 內部漫射光 (右上角) */
            .card-c2-inner {
                position: absolute; inset: 0; pointer-events: none; z-index: 1;
                background: radial-gradient(circle at top right, color-mix(in srgb, var(--c2-color) var(--c2-inner-op), transparent), transparent 60%);
            }
            /* 邊緣極致切線 (右上角) */
            .card-c2-edge {
                position: absolute; inset: 0; pointer-events: none; z-index: 2; border-radius: 24px;
                border-top: 1.5px solid color-mix(in srgb, var(--c2-color) var(--c2-edge-op), transparent);
                border-right: 1.5px solid color-mix(in srgb, var(--c2-color) calc(var(--c2-edge-op) / 2), transparent);
                mask-image: linear-gradient(225deg, black 0%, transparent 50%);
                -webkit-mask-image: linear-gradient(225deg, black 0%, transparent 50%);
            }

            /* 編輯器滑出動畫 */
            .editor-panel { transform: translateX(110%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
            .editor-panel.open { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-darkBg text-gray-300 min-h-screen flex font-sans selection:bg-brand/30 overflow-x-hidden">

    <aside class="w-64 h-screen bg-darkBg border-r border-white/5 p-6 flex flex-col justify-between sticky top-0 shrink-0">
        <nav class="space-y-2 mt-4">
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-cardBg text-brand border border-orange-500/10 font-semibold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z"></path></svg>
                <span>Overview</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto relative">
        <div id="page-overview" class="max-w-5xl space-y-8">
            
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-3xl font-bold text-white tracking-tight">Finance Overview</h1>
                <span class="text-sm text-neutral-500">Click any card to open the Pro Editor ✨</span>
            </div>

            <section class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <div class="card-c1 editable-card p-8 min-h-[240px] flex flex-col justify-between noise-bg" data-target="c1">
                    <div class="card-c1-inner"></div>
                    <div class="card-c1-edge"></div>
                    
                    <div class="relative z-10 h-full flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-sm font-medium text-white/70 tracking-wide uppercase">Monthly Expense</span>
                            <div id="trend-icon"></div>
                        </div>
                        <div>
                            <div id="expense-amount" class="text-[56px] leading-none font-black text-white mb-3 tracking-tighter text-glow animate-pulse">Loading...</div>
                            <div id="mom-text" class="text-sm font-semibold text-white/50">Calculating...</div>
                        </div>
                    </div>
                </div>

                <div class="card-c2 editable-card p-8 min-h-[240px] flex flex-col justify-between noise-bg" data-target="c2">
                    <div class="card-c2-inner"></div>
                    <div class="card-c2-edge"></div>
                    
                    <div class="relative z-10 h-full flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-sm font-medium text-white/70 tracking-wide uppercase">Available Balance</span>
                            <svg class="w-6 h-6 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div>
                            <div id="balance-amount" class="text-[56px] leading-none font-black text-white mb-3 tracking-tighter text-glow animate-pulse">Loading...</div>
                            <div class="text-sm font-semibold text-white/50">Liquid Funds</div>
                        </div>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <div id="editor-panel" class="editor-panel fixed top-6 right-6 bottom-6 w-80 bg-[#0c0c0e]/90 backdrop-blur-xl border border-white/10 rounded-3xl p-6 shadow-2xl z-50 flex flex-col">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-white/10">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                Pro Editor
            </h2>
            <button id="close-editor" class="text-neutral-400 hover:text-white p-1 rounded-md hover:bg-white/10 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="text-sm text-brand font-semibold mb-4 bg-brand/10 p-2 rounded-lg text-center" id="editing-label">Editing: Expense Card</div>

        <div class="space-y-6 overflow-y-auto pr-2 custom-scrollbar">
            
            <div class="flex items-center justify-between">
                <label class="text-sm font-medium text-neutral-300">Base Light Color</label>
                <input type="color" id="ctrl-color" class="w-10 h-10 rounded-lg bg-transparent border border-white/20 cursor-pointer">
            </div>

            <div class="space-y-2">
                <div class="flex justify-between"><label class="text-xs text-neutral-400">Outer Glow Intensity</label><span id="val-glow-op" class="text-xs text-white">20%</span></div>
                <input type="range" id="ctrl-glow-op" min="0" max="100" class="w-full accent-brand">
            </div>

            <div class="space-y-2">
                <div class="flex justify-between"><label class="text-xs text-neutral-400">Outer Glow Spread (px)</label><span id="val-spread" class="text-xs text-white">50</span></div>
                <input type="range" id="ctrl-spread" min="0" max="150" class="w-full accent-brand">
            </div>

            <div class="space-y-2">
                <div class="flex justify-between"><label class="text-xs text-neutral-400">Inner Wash Intensity</label><span id="val-inner-op" class="text-xs text-white">15%</span></div>
                <input type="range" id="ctrl-inner-op" min="0" max="100" class="w-full accent-brand">
            </div>

            <div class="space-y-2">
                <div class="flex justify-between"><label class="text-xs text-neutral-400">Edge Highlight Sharpness</label><span id="val-edge-op" class="text-xs text-white">80%</span></div>
                <input type="range" id="ctrl-edge-op" min="0" max="100" class="w-full accent-brand">
            </div>

            <div class="space-y-2">
                <div class="flex justify-between"><label class="text-xs text-neutral-400">Background Darkness</label><span id="val-bg-op" class="text-xs text-white">90%</span></div>
                <input type="range" id="ctrl-bg-op" min="0" max="100" class="w-full accent-brand">
            </div>

            <hr class="border-white/10">

            <div class="space-y-2">
                <div class="flex justify-between"><label class="text-xs text-neutral-400">Global Noise Texture</label><span id="val-noise-op" class="text-xs text-brand">4%</span></div>
                <input type="range" id="ctrl-noise-op" min="0" max="15" class="w-full accent-brand">
            </div>

        </div>
    </div>

    <script>
        // --- 核心 API 抓取邏輯 (維持不變) ---
        async function fetchExpenseData() {
            const amountEl = document.getElementById('expense-amount');
            const momEl = document.getElementById('mom-text');
            const iconEl = document.getElementById('trend-icon');
            try {
                const res = await fetch('/api/get-expense');
                const data = await res.json();
                if (data.total !== undefined) {
                    amountEl.classList.remove('animate-pulse');
                    amountEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    momEl.classList.remove('animate-pulse');
                    const momVal = Math.abs(data.mom).toFixed(1);
                    if (data.mom > 0) {
                        momEl.innerText = `(+${momVal}% MoM)`; momEl.className = 'text-sm font-semibold text-rose-400';
                        iconEl.innerHTML = `<svg class="w-6 h-6 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>`;
                    } else if (data.mom < 0) {
                        momEl.innerText = `(-${momVal}% MoM)`; momEl.className = 'text-sm font-semibold text-emerald-400';
                        iconEl.innerHTML = `<svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>`;
                    } else {
                        momEl.innerText = `(0.0% MoM)`; momEl.className = 'text-sm font-semibold text-neutral-500'; iconEl.innerHTML = ''; 
                    }
                }
            } catch (e) { amountEl.innerText = 'Error'; }
        }

        async function fetchBalanceData() {
            const balanceEl = document.getElementById('balance-amount');
            try {
                const res = await fetch('/api/get-balance');
                const data = await res.json();
                if (data.total !== undefined) {
                    balanceEl.classList.remove('animate-pulse');
                    balanceEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                } else { balanceEl.innerText = 'Error'; }
            } catch (e) { balanceEl.innerText = 'Error'; }
        }
        fetchExpenseData(); fetchBalanceData();

        // --- 🛠️ Pro Editor 控制邏輯 ---
        const editorPanel = document.getElementById('editor-panel');
        const closeBtn = document.getElementById('close-editor');
        const cards = document.querySelectorAll('.editable-card');
        let currentCard = 'c1'; // 'c1' 或是 'c2'

        // 定義每一張卡的 State
        const state = {
            noise: 4,
            c1: { color: '#e83893', glowOp: 20, spread: 50, innerOp: 15, edgeOp: 80, bgOp: 90 },
            c2: { color: '#ff9d00', glowOp: 20, spread: 50, innerOp: 15, edgeOp: 80, bgOp: 90 }
        };

        // 綁定 UI 元素
        const ctrlColor = document.getElementById('ctrl-color');
        const ctrlGlowOp = document.getElementById('ctrl-glow-op');
        const ctrlSpread = document.getElementById('ctrl-spread');
        const ctrlInnerOp = document.getElementById('ctrl-inner-op');
        const ctrlEdgeOp = document.getElementById('ctrl-edge-op');
        const ctrlBgOp = document.getElementById('ctrl-bg-op');
        const ctrlNoiseOp = document.getElementById('ctrl-noise-op');

        // 更新面板顯示的數值與滑桿位置
        function updatePanelUI() {
            const s = state[currentCard];
            document.getElementById('editing-label').innerText = currentCard === 'c1' ? 'Editing: Expense Card' : 'Editing: Balance Card';
            document.getElementById('editing-label').style.color = s.color;
            
            ctrlColor.value = s.color;
            ctrlGlowOp.value = s.glowOp; document.getElementById('val-glow-op').innerText = s.glowOp + '%';
            ctrlSpread.value = s.spread; document.getElementById('val-spread').innerText = s.spread;
            ctrlInnerOp.value = s.innerOp; document.getElementById('val-inner-op').innerText = s.innerOp + '%';
            ctrlEdgeOp.value = s.edgeOp; document.getElementById('val-edge-op').innerText = s.edgeOp + '%';
            ctrlBgOp.value = s.bgOp; document.getElementById('val-bg-op').innerText = s.bgOp + '%';
            ctrlNoiseOp.value = state.noise; document.getElementById('val-noise-op').innerText = state.noise + '%';
        }

        // 開啟面板
        cards.forEach(card => {
            card.addEventListener('click', () => {
                currentCard = card.getAttribute('data-target');
                updatePanelUI();
                editorPanel.classList.add('open');
            });
        });

        // 關閉面板
        closeBtn.addEventListener('click', () => {
            editorPanel.classList.remove('open');
        });

        // 監聽修改並即時寫入 CSS 變數
        function updateCSSVar(prop, value, unit = '') {
            document.documentElement.style.setProperty(`--${currentCard}-${prop}`, value + unit);
        }

        ctrlColor.addEventListener('input', (e) => { state[currentCard].color = e.target.value; updateCSSVar('color', e.target.value); updatePanelUI(); });
        ctrlGlowOp.addEventListener('input', (e) => { state[currentCard].glowOp = e.target.value; updateCSSVar('glow-op', e.target.value, '%'); updatePanelUI(); });
        ctrlSpread.addEventListener('input', (e) => { state[currentCard].spread = e.target.value; updateCSSVar('spread', e.target.value, 'px'); updatePanelUI(); });
        ctrlInnerOp.addEventListener('input', (e) => { state[currentCard].innerOp = e.target.value; updateCSSVar('inner-op', e.target.value, '%'); updatePanelUI(); });
        ctrlEdgeOp.addEventListener('input', (e) => { state[currentCard].edgeOp = e.target.value; updateCSSVar('edge-op', e.target.value, '%'); updatePanelUI(); });
        ctrlBgOp.addEventListener('input', (e) => { state[currentCard].bgOp = e.target.value; updateCSSVar('bg-op', e.target.value, '%'); updatePanelUI(); });
        
        // 全局噪點獨立控制
        ctrlNoiseOp.addEventListener('input', (e) => { 
            state.noise = e.target.value; 
            document.documentElement.style.setProperty('--noise-op', e.target.value / 100); 
            document.getElementById('val-noise-op').innerText = e.target.value + '%';
        });

    </script>
</body>
</html>
