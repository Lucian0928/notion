<!DOCTYPE html>
<html lang="zh-TW">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: '#FF7A00', /* 🌟 你的科技橘色碼 */

                    },
                    boxShadow: {
                        /* 🌟 核心魔術：定義 Pinterest 風的科技發光光暈 */
                        'glow': '0 0 10px 1px rgba(255, 122, 0, 0.15), 0 0 20px 2px rgba(255, 122, 0, 0.05)',
                    }
                }
            }
        }
    </script>
