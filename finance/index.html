<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINANCE DASHBOARD - PERFECT METALLIC</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: '#FF7A00', cardBg: '#09090B' }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        /* 🔥 這次絕對有變化的關鍵：網頁全局環境光 */
        body {
            /* 1. 明顯的深空灰底色，絕對不再是死黑 */
            background-color: #0E0E12 !important;
            /* 2. 螢幕頂部打下一道極為明顯的冷白色聚光燈，讓背景呈現立體漸層 */
            background-image: 
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(65, 65, 80, 0.4) 0%, transparent 100%),
                /* 底部壓暗，創造無限延伸的空間感 */
                radial-gradient(ellipse 100% 40% at 50% 110%, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            background-attachment: fixed;
        }

        @layer utilities {
            /* 數字頂級發光效果 */
            .text-glow {
                text-shadow: 0 0 12px rgba(255,255,255,0.3), 0 0 24px rgba(255,255,255,0.1);
            }

            /* 高級金屬微細顆粒 */
            .metal-grain::after {
                content: ""; position: absolute; inset: 0; border-radius: inherit;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
                opacity: 0.025; pointer-events: none; mix-blend-mode: overlay; z-index: 5;
            }

            /* =========================================
               🚀 THE PREMIUM SPECULAR METALLIC ENGINE
               ========================================= */
            
            /* --- 1. Monthly Expense (頂級冷酒紅金屬卡) --- */
            .card-premium-pink {
                background: linear-gradient(145deg, #472c35 0%, #311b22 50%, #170d11 100%);
                border-radius: 24px; position: relative; overflow: hidden;
                box-shadow: 
                    inset 0 1px 1px rgba(255, 255, 255, 0.08),
                    0 0 0 1px rgba(228, 96, 176, 0.12),
                    0 25px 50px -12px rgba(0, 0, 0, 0.7),
                    0 0 35px -5px rgba(228, 96, 176, 0.08);
            }

            /* --- 2. Available Balance (頂級冷黃金屬卡) --- */
            .card-premium-orange {
                background: linear-gradient(145deg, #422a15 0%, #2b1a0c 50%, #140d05 100%);
                border-radius: 24px; position: relative; overflow: hidden;
                box-shadow: 
                    inset 0 1px 1px rgba(255, 255, 255, 0.08),
                    0 0 0 1px rgba(255, 157, 0, 0.12),
                    0 25px 50px -12px rgba(0, 0, 0, 0.7),
                    0 0 35px -5px rgba(255, 157, 0, 0.08);
            }
        }
    </style>
</head>
<body class="text-gray-300 min-h-screen flex font-sans selection:bg-brand/30">

    <aside class="w-64 h-screen border-r border-white/5 p-6 flex flex-col justify-between sticky top-0 shrink-0 z-10 bg-[#08080a]/60 backdrop-blur-xl">
        <nav class="space-y-2 mt-4" id="sidebar-nav">
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-[#141417]/80 text-brand border border-white/5 font-semibold shadow-[0_0_10px_rgba(255,122,0,0.02)]">
                <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z"></path></svg>
                <span>Overview</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-neutral-500 hover:bg-white/5 transition-all duration-200">
                <svg class="w-5 h-5 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                <span>Transactions</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto relative z-10">
        <div id="page-overview" class="content-page space-y-12">
            
            <div class="max-w-4xl flex items-center justify-between">
                <h1 class="text-3xl font-bold text-white tracking-tight">Finance Overview</h1>
            </div>

            <section class="max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <div class="relative card-premium-pink metal-grain p-8 min-h-[230px] flex flex-col justify-between transition-transform hover:-translate-y-1 duration-300">
                    
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[45%] h-[1.5px] bg-gradient-to-r from-transparent via-white/90 to-transparent z-10"></div>
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[60px] h-[10px] bg-white/20 blur-[5px] rounded-full pointer-events-none z-10"></div>

                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[30%] h-[1px] bg-gradient-to-r from-transparent via-white/40 to-transparent z-10"></div>
                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[40px] h-[6px] bg-white/10 blur-[4px] rounded-full pointer-events-none z-10"></div>

                    <div class="absolute inset-0 bg-gradient-to-br from-[#9b5f66]/20 via-transparent to-transparent pointer-events-none z-1"></div>

                    <div class="relative z-10 h-full flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-xs font-bold text-[#E5C3D5] tracking-widest uppercase opacity-80">Monthly Expense</span>
                            <div id="trend-icon"></div>
                        </div>
                        
                        <div>
                            <div id="expense-amount" class="text-5xl font-black text-white mb-2 tracking-tighter text-glow animate-pulse">Loading...</div>
                            <div id="mom-text" class="text-xs font-bold text-[#E460B0] tracking-wide">Calculating...</div>
                        </div>
                    </div>
                </div>

                <div class="relative card-premium-orange metal-grain p-8 min-h-[230px] flex flex-col justify-between transition-transform hover:-translate-y-1 duration-300">
                    
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[45%] h-[1.5px] bg-gradient-to-r from-transparent via-white/90 to-transparent z-10"></div>
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[60px] h-[10px] bg-white/20 blur-[5px] rounded-full pointer-events-none z-10"></div>

                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[30%] h-[1px] bg-gradient-to-r from-transparent via-white/40 to-transparent z-10"></div>
                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[40px] h-[6px] bg-white/10 blur-[4px] rounded-full pointer-events-none z-10"></div>

                    <div class="absolute inset-0 bg-gradient-to-bl from-[#FFC850]/10 via-transparent to-transparent pointer-events-none z-1"></div>

                    <div class="relative z-10 h-full flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-xs font-bold text-[#E6D5B8] tracking-widest uppercase opacity-80">Available Balance</span>
                            <svg class="w-5 h-5 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        
                        <div>
                            <div id="balance-amount" class="text-5xl font-black text-white mb-2 tracking-tighter text-glow animate-pulse">Loading...</div>
                            <div class="text-xs font-bold text-[#FF9D00] tracking-wide uppercase">Liquid Funds</div>
                        </div>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <script>
        async function fetchExpenseData() {
            const amountEl = document.getElementById('expense-amount');
            const momEl = document.getElementById('mom-text');
            const iconEl = document.getElementById('trend-icon');
            
            try {
                const res = await fetch('/api/get-expense');
                const data = await res.json();
                
                if (data.total !== undefined) {
                    amountEl.classList.remove('animate-pulse');
                    amountEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    
                    momEl.classList.remove('animate-pulse');
                    const formattedMom = Math.abs(data.mom).toFixed(1);

                    const upArrow = `<svg class="w-5 h-5 text-[#E460B0]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>`;
                    const downArrow = `<svg class="w-5 h-5 text-[#76A88A]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>`;

                    if (data.mom > 0) {
                        momEl.innerText = `(+${formattedMom}% MoM)`;
                        momEl.className = 'text-xs font-bold text-[#E460B0] tracking-wide';
                        iconEl.innerHTML = upArrow;
                    } else {
                        momEl.innerText = `(-${formattedMom}% MoM)`;
                        momEl.className = 'text-xs font-bold text-[#76A88A] tracking-wide';
                        iconEl.innerHTML = downArrow;
                    }
                }
            } catch (e) {
                amountEl.innerText = '讀取錯誤';
            }
        }

        async function fetchBalanceData() {
            const balanceEl = document.getElementById('balance-amount');
            try {
                const res = await fetch('/api/get-balance');
                const data = await res.json();
                
                if (data.total !== undefined) {
                    balanceEl.classList.remove('animate-pulse');
                    balanceEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                }
            } catch (e) {
                balanceEl.innerText = '連線失敗';
            }
        }

        fetchExpenseData();
        fetchBalanceData();
    </script>
</body>
</html>
