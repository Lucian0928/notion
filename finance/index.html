<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINANCE DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: '#FF7A00', darkBg: '#030303', cardBg: '#09090B' }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            /* 字體發光層次 */
            .text-glow {
                text-shadow: 0 0 12px rgba(255,255,255,0.4), 0 0 24px rgba(255,255,255,0.2);
            }

            /* 噪點質地 */
            .noise-bg::after {
                content: "";
                position: absolute;
                inset: 0;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
                opacity: 0.035; 
                pointer-events: none;
                mix-blend-mode: overlay;
                z-index: 5;
            }

            /* 🔥 1. 粉紅卡：多圈漸層邊框大升級 */
            .card-pink {
                background: linear-gradient(145deg, #572f33 0%, #472c35 45%, #251419 100%);
                box-shadow:
                    /* --- 內側高光 (製造立體厚度) --- */
                    inset 0 1px 1px rgba(255, 255, 255, 0.1),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.03),

                    /* --- 🔥 你的要求：多圈漸層邊框 (從最深到最淺) --- */
                    /* 第 1 圈：最亮、最細的實體邊界 */
                    0 0 0 1px rgba(210, 60, 170, 0.35),
                    /* 第 2 圈：微距暈染，透明度減半 */
                    0 0 0 2px rgba(210, 60, 170, 0.15),
                    /* 第 3 圈：擴大一倍，顏色轉柔 */
                    0 0 0 4px rgba(160, 40, 220, 0.08),
                    /* 第 4 圈：最外圍的邊界氣息，完美融入光暈 */
                    0 0 0 6px rgba(160, 40, 220, 0.03),

                    /* --- 原本的環境漫射光暈 --- */
                    0 0 30px 0 rgba(210, 60, 170, 0.15),     /* 近光暈 */
                    0 0 80px -10px rgba(160, 40, 220, 0.15); /* 遠光暈 */
            }
            .card-pink::before {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient(circle at top left, rgba(155,95,102,0.4), transparent 65%);
                pointer-events: none;
                z-index: 1;
            }

            /* 🔥 2. 橘色卡：多圈漸層邊框大升級 */
            .card-orange {
                background: linear-gradient(145deg, #5a3c1f 0%, #422a15 45%, #1c1007 100%);
                box-shadow:
                    /* --- 內側高光 --- */
                    inset 0 1px 1px rgba(255, 255, 255, 0.1),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.03),

                    /* --- 🔥 多圈漸層邊框 --- */
                    /* 第 1 圈 */
                    0 0 0 1px rgba(255, 150, 50, 0.35),
                    /* 第 2 圈 */
                    0 0 0 2px rgba(255, 122, 0, 0.15),
                    /* 第 3 圈 */
                    0 0 0 4px rgba(255, 122, 0, 0.08),
                    /* 第 4 圈 */
                    0 0 0 6px rgba(255, 122, 0, 0.03),

                    /* --- 環境漫射光暈 --- */
                    0 0 30px 0 rgba(255, 122, 0, 0.15),
                    0 0 80px -10px rgba(255, 122, 0, 0.12);
            }
            .card-orange::before {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient(circle at top right, rgba(230,160,80,0.25), transparent 65%);
                pointer-events: none;
                z-index: 1;
            }
        }
    </style>
</head>
<body class="bg-darkBg text-gray-300 min-h-screen flex font-sans selection:bg-brand/30">

    <aside class="w-64 h-screen bg-darkBg border-r border-white/5 p-6 flex flex-col justify-between sticky top-0">
        <nav class="space-y-2 mt-4" id="sidebar-nav">
            <a href="#" data-target="page-overview" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl bg-cardBg text-brand border border-orange-500/10 font-semibold transition-all duration-200">
                <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z"></path></svg>
                <span>Overview</span>
            </a>
            <a href="#" data-target="page-transactions" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-neutral-500 hover:bg-white/5 transition-all duration-200">
                <svg class="w-5 h-5 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                <span>Transactions</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <div id="page-overview" class="content-page space-y-8">
            
            <section class="max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <div class="relative rounded-3xl p-8 min-h-[220px] flex flex-col justify-between overflow-hidden card-pink noise-bg transition-transform hover:-translate-y-1 duration-300">
                    
                    <div class="relative z-10">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-sm font-medium text-[#E5C3D5] tracking-wide">Monthly Expense</span>
                            <div id="trend-icon"></div>
                        </div>
                        
                        <div>
                            <div id="expense-amount" class="text-5xl font-black text-white mb-2 tracking-tighter text-glow animate-pulse">Loading...</div>
                            <div id="mom-text" class="text-sm font-semibold text-[#D4B6BB]">Calculating...</div>
                        </div>
                    </div>
                </div>

                <div class="relative rounded-3xl p-8 min-h-[220px] flex flex-col justify-between overflow-hidden card-orange noise-bg transition-transform hover:-translate-y-1 duration-300">
                    
                    <div class="relative z-10">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-sm font-medium text-[#E6D5B8] tracking-wide">Available Balance</span>
                            <svg class="w-6 h-6 text-[#FFC850]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        
                        <div>
                            <div id="balance-amount" class="text-5xl font-black text-white mb-2 tracking-tighter text-glow animate-pulse">Loading...</div>
                            <div class="text-sm font-semibold text-[#FFC850]/80">Liquid Funds</div>
                        </div>
                    </div>
                </div>

            </section>
        </div>
        
        <div id="page-transactions" class="content-page space-y-4 hidden">
            <h2 class="text-xl font-bold text-white tracking-wide">Transactions Ledger</h2>
        </div>
    </main>

    <script>
        const navItems = document.querySelectorAll('.nav-item');
        const contentPages = document.querySelectorAll('.content-page');
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                navItems.forEach(nav => {
                    nav.className = "nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-neutral-500 hover:bg-white/5 transition-all duration-200";
                });
                item.className = "nav-item flex items-center gap-3 px-4 py-3 rounded-xl bg-cardBg text-brand border border-orange-500/10 font-semibold transition-all duration-200";
                contentPages.forEach(p => p.classList.add('hidden'));
                document.getElementById(item.getAttribute('data-target')).classList.remove('hidden');
            });
        });

        async function fetchExpenseData() {
            const amountEl = document.getElementById('expense-amount');
            const momEl = document.getElementById('mom-text');
            const iconEl = document.getElementById('trend-icon');
            
            try {
                const res = await fetch('/api/get-expense');
                const data = await res.json();
                
                if (data.total !== undefined) {
                    amountEl.classList.remove('animate-pulse');
                    amountEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    
                    momEl.classList.remove('animate-pulse');
                    const formattedMom = Math.abs(data.mom).toFixed(1);

                    const upArrow = `<svg class="w-6 h-6 text-[#E460B0]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>`;
                    const downArrow = `<svg class="w-6 h-6 text-[#76A88A]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>`;

                    if (data.mom > 0) {
                        momEl.innerText = `(+${formattedMom}% MoM)`;
                        momEl.className = 'text-sm font-semibold text-[#E460B0]';
                        iconEl.innerHTML = upArrow;
                    } else if (data.mom < 0) {
                        momEl.innerText = `(-${formattedMom}% MoM)`;
                        momEl.className = 'text-sm font-semibold text-[#76A88A]';
                        iconEl.innerHTML = downArrow;
                    } else {
                        momEl.innerText = `(0.0% MoM)`;
                        momEl.className = 'text-sm font-semibold text-neutral-500';
                        iconEl.innerHTML = ''; 
                    }
                }
            } catch (e) {
                amountEl.innerText = '讀取錯誤';
                momEl.innerText = 'N/A';
            }
        }

        async function fetchBalanceData() {
            const balanceEl = document.getElementById('balance-amount');
            try {
                const res = await fetch('/api/get-balance');
                const data = await res.json();
                
                if (data.total !== undefined) {
                    balanceEl.classList.remove('animate-pulse');
                    balanceEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                } else {
                    balanceEl.innerText = '讀取錯誤';
                }
            } catch (e) {
                balanceEl.innerText = '連線失敗';
            }
        }

        fetchExpenseData();
        fetchBalanceData();
    </script>
</body>
</html>
