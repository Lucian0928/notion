<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINANCE DASHBOARD - GLASS ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    /* 極致黑背景，讓玻璃反光能 100% 呈現 */
                    colors: { brand: '#FF7A00', darkBg: '#020202', cardBg: '#09090B' }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        /* 🔥 玻璃引擎核心變數 (RGB格式，方便控制 Alpha 透明度) */
        :root {
            /* Card 1: Expense */
            --c1-base-rgb: 48, 16, 21;    /* 玻璃底色 (深酒紅) */
            --c1-neon-rgb: 255, 43, 109;  /* 霓虹光源 (亮粉紅) */
            --c1-glass-alpha: 0.6;        /* 玻璃不透明度 (越低越透) */
            --c1-glass-blur: 24px;        /* 玻璃模糊度 (毛玻璃感) */
            --c1-edge-alpha: 0.6;         /* 邊緣切割反光亮度 */
            --c1-inner-alpha: 0.25;       /* 內部漫射光強度 */
            --c1-glow-alpha: 0.15;        /* 外圍光暈強度 */
            --c1-glow-spread: 50px;       /* 外圍光暈擴散範圍 */

            /* Card 2: Balance */
            --c2-base-rgb: 36, 20, 5;
            --c2-neon-rgb: 255, 122, 0;
            --c2-glass-alpha: 0.6;
            --c2-glass-blur: 24px;
            --c2-edge-alpha: 0.6;
            --c2-inner-alpha: 0.25;
            --c2-glow-alpha: 0.15;
            --c2-glow-spread: 50px;
        }

        @layer utilities {
            .text-glow {
                text-shadow: 0 0 12px rgba(255,255,255,0.4), 0 0 24px rgba(255,255,255,0.2);
            }

            .editable-card { cursor: pointer; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
            .editable-card:hover { transform: translateY(-4px) scale(1.01); }
            .editable-card::before {
                content: "Click to Tweak Glass 🎛️"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
                padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; color: white;
                opacity: 0; transition: opacity 0.2s; z-index: 30; pointer-events: none; border: 1px solid rgba(255,255,255,0.1);
            }
            .editable-card:hover::before { opacity: 1; }

            /* =========================================
               🚀 THE GLASS ENGINE (完美玻璃渲染器)
               ========================================= */
            .glass-card-c1 {
                /* 1. 玻璃本體底色與透明度 */
                background-color: rgba(var(--c1-base-rgb), var(--c1-glass-alpha));
                /* 2. 背景模糊 (Frosted Glass) */
                backdrop-filter: blur(var(--c1-glass-blur)); -webkit-backdrop-filter: blur(var(--c1-glass-blur));
                border-radius: 24px; position: relative; overflow: hidden;
                /* 3. 深度陰影與外部發光 */
                box-shadow: 
                    0 20px 40px -10px rgba(0,0,0, 0.9),
                    0 0 var(--c1-glow-spread) 0 rgba(var(--c1-neon-rgb), var(--c1-glow-alpha));
            }
            /* 4. 內部漫射光 (左上角) */
            .glass-card-c1 > .inner-light {
                position: absolute; inset: 0; pointer-events: none; z-index: 1;
                background: radial-gradient(circle at top left, rgba(var(--c1-neon-rgb), var(--c1-inner-alpha)) 0%, transparent 60%);
            }
            /* 5. 頂級無痕漸隱邊緣光 (Apple 官網寫法) */
            .glass-card-c1::after {
                content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
                padding: 1.5px; /* 邊光厚度 */
                background: linear-gradient(135deg, rgba(255,255,255, var(--c1-edge-alpha)) 0%, transparent 40%);
                -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
                -webkit-mask-composite: xor; mask-composite: exclude;
            }

            /* --- Card 2 (Balance) --- */
            .glass-card-c2 {
                background-color: rgba(var(--c2-base-rgb), var(--c2-glass-alpha));
                backdrop-filter: blur(var(--c2-glass-blur)); -webkit-backdrop-filter: blur(var(--c2-glass-blur));
                border-radius: 24px; position: relative; overflow: hidden;
                box-shadow: 
                    0 20px 40px -10px rgba(0,0,0, 0.9),
                    0 0 var(--c2-glow-spread) 0 rgba(var(--c2-neon-rgb), var(--c2-glow-alpha));
            }
            .glass-card-c2 > .inner-light {
                position: absolute; inset: 0; pointer-events: none; z-index: 1;
                /* 橘卡光從右上角打 */
                background: radial-gradient(circle at top right, rgba(var(--c2-neon-rgb), var(--c2-inner-alpha)) 0%, transparent 60%);
            }
            .glass-card-c2::after {
                content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
                padding: 1.5px;
                /* 從右上方往左下淡出 */
                background: linear-gradient(225deg, rgba(255,255,255, var(--c2-edge-alpha)) 0%, transparent 40%);
                -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
                -webkit-mask-composite: xor; mask-composite: exclude;
            }

            .editor-panel { transform: translateX(105%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
            .editor-panel.open { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-darkBg text-gray-300 min-h-screen flex font-sans selection:bg-brand/30 overflow-x-hidden">

    <aside class="w-64 h-screen bg-darkBg border-r border-white/5 p-6 flex flex-col justify-between sticky top-0 shrink-0 z-10">
        <nav class="space-y-2 mt-4">
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-cardBg text-brand border border-orange-500/10 font-semibold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z"></path></svg>
                <span>Overview</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto relative bg-[url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noise%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noise)%22 opacity=%220.03%22/%3E%3C/svg%3E')]">
        
        <div id="page-overview" class="max-w-5xl space-y-8 relative z-10">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-3xl font-bold text-white tracking-tight">Finance Overview</h1>
                <span class="text-sm font-medium text-neutral-500 bg-neutral-900/50 px-4 py-1.5 rounded-full border border-white/5">Tap cards to adjust parameters</span>
            </div>

            <section class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                
                <div class="glass-card-c1 editable-card p-8 min-h-[240px] flex flex-col justify-between" data-target="c1">
                    <div class="inner-light"></div>
                    
                    <div class="relative z-10 h-full flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-sm font-medium text-white/80 tracking-wide uppercase">Monthly Expense</span>
                            <div id="trend-icon"></div>
                        </div>
                        <div>
                            <div id="expense-amount" class="text-[56px] leading-none font-black text-white mb-3 tracking-tighter text-glow animate-pulse">Loading...</div>
                            <div id="mom-text" class="text-sm font-semibold text-white/60">Calculating...</div>
                        </div>
                    </div>
                </div>

                <div class="glass-card-c2 editable-card p-8 min-h-[240px] flex flex-col justify-between" data-target="c2">
                    <div class="inner-light"></div>
                    
                    <div class="relative z-10 h-full flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-sm font-medium text-white/80 tracking-wide uppercase">Available Balance</span>
                            <svg class="w-6 h-6 text-white/90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div>
                            <div id="balance-amount" class="text-[56px] leading-none font-black text-white mb-3 tracking-tighter text-glow animate-pulse">Loading...</div>
                            <div class="text-sm font-semibold text-white/60">Liquid Funds</div>
                        </div>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <div id="editor-panel" class="editor-panel fixed top-6 right-6 bottom-6 w-[360px] bg-[#0c0c0e]/95 backdrop-blur-3xl border border-white/10 rounded-3xl p-6 shadow-2xl z-50 flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-4 border-b border-white/10">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">🎛️ Glass Engine</h2>
            <button id="close-editor" class="text-neutral-400 hover:text-white p-1.5 bg-white/5 rounded-full hover:bg-white/10 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="text-xs font-bold mb-6 px-3 py-2 rounded-lg text-center bg-white/10 border border-white/5 tracking-wider uppercase" id="editing-label">TARGET CARD</div>

        <div class="space-y-6 overflow-y-auto pr-2 custom-scrollbar pb-10">
            
            <div class="space-y-4">
                <h3 class="text-[11px] font-bold text-neutral-500 uppercase tracking-widest flex items-center justify-between">1. Colors <span class="text-neutral-700">Hex</span></h3>
                <div class="flex items-center justify-between bg-black/40 p-2.5 rounded-xl border border-white/5">
                    <label class="text-xs text-neutral-300 font-medium">Glass Base Tint</label>
                    <input type="color" id="ctrl-base-color" class="w-7 h-7 rounded cursor-pointer border-0 bg-transparent">
                </div>
                <div class="flex items-center justify-between bg-black/40 p-2.5 rounded-xl border border-white/5">
                    <label class="text-xs text-neutral-300 font-medium">Neon Light Source</label>
                    <input type="color" id="ctrl-neon-color" class="w-7 h-7 rounded cursor-pointer border-0 bg-transparent">
                </div>
            </div>

            <hr class="border-white/5">

            <div class="space-y-5">
                <h3 class="text-[11px] font-bold text-neutral-500 uppercase tracking-widest flex items-center justify-between">2. Glass Physics <span class="text-neutral-700">Alpha / Blur</span></h3>
                
                <div class="space-y-1.5">
                    <div class="flex justify-between"><label class="text-xs text-neutral-300">Glass Opacity (Tint)</label><span id="val-glass-alpha" class="text-xs text-brand font-mono"></span></div>
                    <input type="range" id="ctrl-glass-alpha" min="0" max="100" class="w-full accent-brand">
                </div>
                
                <div class="space-y-1.5">
                    <div class="flex justify-between"><label class="text-xs text-neutral-300">Backdrop Blur</label><span id="val-glass-blur" class="text-xs text-brand font-mono"></span></div>
                    <input type="range" id="ctrl-glass-blur" min="0" max="100" class="w-full accent-brand">
                </div>
            </div>

            <hr class="border-white/5">

            <div class="space-y-5">
                <h3 class="text-[11px] font-bold text-neutral-500 uppercase tracking-widest flex items-center justify-between">3. Lighting & Glow <span class="text-neutral-700">Intensity</span></h3>
                
                <div class="space-y-1.5">
                    <div class="flex justify-between"><label class="text-xs text-neutral-300">Edge Reflection (Rim Light)</label><span id="val-edge-alpha" class="text-xs text-white font-mono"></span></div>
                    <input type="range" id="ctrl-edge-alpha" min="0" max="100" class="w-full accent-white">
                </div>

                <div class="space-y-1.5">
                    <div class="flex justify-between"><label class="text-xs text-neutral-300">Inner Light Wash</label><span id="val-inner-alpha" class="text-xs text-white font-mono"></span></div>
                    <input type="range" id="ctrl-inner-alpha" min="0" max="100" class="w-full accent-white">
                </div>

                <div class="space-y-1.5">
                    <div class="flex justify-between"><label class="text-xs text-neutral-300">Outer Glow Opacity</label><span id="val-glow-alpha" class="text-xs text-white font-mono"></span></div>
                    <input type="range" id="ctrl-glow-alpha" min="0" max="100" class="w-full accent-white">
                </div>

                <div class="space-y-1.5">
                    <div class="flex justify-between"><label class="text-xs text-neutral-300">Outer Glow Spread</label><span id="val-glow-spread" class="text-xs text-white font-mono"></span></div>
                    <input type="range" id="ctrl-glow-spread" min="0" max="150" class="w-full accent-white">
                </div>
            </div>

        </div>
    </div>

    <script>
        // API 獲取資料
        async function fetchExpenseData() {
            const amountEl = document.getElementById('expense-amount');
            const momEl = document.getElementById('mom-text');
            const iconEl = document.getElementById('trend-icon');
            try {
                const res = await fetch('/api/get-expense');
                const data = await res.json();
                if (data.total !== undefined) {
                    amountEl.classList.remove('animate-pulse');
                    amountEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    momEl.classList.remove('animate-pulse');
                    const momVal = Math.abs(data.mom).toFixed(1);
                    if (data.mom > 0) {
                        momEl.innerText = `(+${momVal}% MoM)`; momEl.className = 'text-sm font-semibold text-[#ff2b6d]';
                        iconEl.innerHTML = `<svg class="w-6 h-6 text-[#ff2b6d]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>`;
                    } else {
                        momEl.innerText = `(-${momVal}% MoM)`; momEl.className = 'text-sm font-semibold text-[#76A88A]';
                        iconEl.innerHTML = `<svg class="w-6 h-6 text-[#76A88A]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>`;
                    }
                }
            } catch (e) { amountEl.innerText = 'Error'; }
        }

        async function fetchBalanceData() {
            const balanceEl = document.getElementById('balance-amount');
            try {
                const res = await fetch('/api/get-balance');
                const data = await res.json();
                if (data.total !== undefined) {
                    balanceEl.classList.remove('animate-pulse');
                    balanceEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                } else { balanceEl.innerText = 'Error'; }
            } catch (e) { balanceEl.innerText = 'Error'; }
        }
        fetchExpenseData(); fetchBalanceData();

        // 🎛️ GLASS ENGINE LOGIC 
        // Hex 轉 RGB (為了給 rgba() 使用)
        function hexToRgb(hex) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        }
        function rgbToHex(rgbStr) {
            const [r, g, b] = rgbStr.split(',').map(x => parseInt(x.trim()));
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
        }

        const editorPanel = document.getElementById('editor-panel');
        const cards = document.querySelectorAll('.editable-card');
        let currentCard = 'c1';

        // State 管理 8 大玻璃維度
        const state = {
            c1: { baseRgb: '48, 16, 21', neonRgb: '255, 43, 109', glassAlpha: 60, glassBlur: 24, edgeAlpha: 60, innerAlpha: 25, glowAlpha: 15, glowSpread: 50 },
            c2: { baseRgb: '36, 20, 5', neonRgb: '255, 122, 0', glassAlpha: 60, glassBlur: 24, edgeAlpha: 60, innerAlpha: 25, glowAlpha: 15, glowSpread: 50 }
        };

        const inputs = {
            baseColor: document.getElementById('ctrl-base-color'),
            neonColor: document.getElementById('ctrl-neon-color'),
            glassAlpha: document.getElementById('ctrl-glass-alpha'),
            glassBlur: document.getElementById('ctrl-glass-blur'),
            edgeAlpha: document.getElementById('ctrl-edge-alpha'),
            innerAlpha: document.getElementById('ctrl-inner-alpha'),
            glowAlpha: document.getElementById('ctrl-glow-alpha'),
            glowSpread: document.getElementById('ctrl-glow-spread')
        };

        function updatePanelUI() {
            const s = state[currentCard];
            document.getElementById('editing-label').innerText = currentCard === 'c1' ? 'Target: Expense Card' : 'Target: Balance Card';
            document.getElementById('editing-label').style.color = rgbToHex(s.neonRgb);

            inputs.baseColor.value = rgbToHex(s.baseRgb);
            inputs.neonColor.value = rgbToHex(s.neonRgb);
            
            inputs.glassAlpha.value = s.glassAlpha; document.getElementById('val-glass-alpha').innerText = s.glassAlpha + '%';
            inputs.glassBlur.value = s.glassBlur; document.getElementById('val-glass-blur').innerText = s.glassBlur + 'px';
            inputs.edgeAlpha.value = s.edgeAlpha; document.getElementById('val-edge-alpha').innerText = s.edgeAlpha + '%';
            inputs.innerAlpha.value = s.innerAlpha; document.getElementById('val-inner-alpha').innerText = s.innerAlpha + '%';
            inputs.glowAlpha.value = s.glowAlpha; document.getElementById('val-glow-alpha').innerText = s.glowAlpha + '%';
            inputs.glowSpread.value = s.glowSpread; document.getElementById('val-glow-spread').innerText = s.glowSpread + 'px';
        }

        cards.forEach(card => {
            card.addEventListener('click', () => {
                currentCard = card.getAttribute('data-target');
                updatePanelUI();
                editorPanel.classList.add('open');
            });
        });

        document.getElementById('close-editor').addEventListener('click', () => { editorPanel.classList.remove('open'); });

        function updateCSSVar(prop, value, unit = '') {
            document.documentElement.style.setProperty(`--${currentCard}-${prop}`, value + unit);
        }

        // 事件綁定
        inputs.baseColor.addEventListener('input', (e) => { state[currentCard].baseRgb = hexToRgb(e.target.value); updateCSSVar('base-rgb', state[currentCard].baseRgb); });
        inputs.neonColor.addEventListener('input', (e) => { state[currentCard].neonRgb = hexToRgb(e.target.value); updateCSSVar('neon-rgb', state[currentCard].neonRgb); updatePanelUI(); });
        
        inputs.glassAlpha.addEventListener('input', (e) => { state[currentCard].glassAlpha = e.target.value; updateCSSVar('glass-alpha', e.target.value / 100); document.getElementById('val-glass-alpha').innerText = e.target.value + '%'; });
        inputs.glassBlur.addEventListener('input', (e) => { state[currentCard].glassBlur = e.target.value; updateCSSVar('glass-blur', e.target.value, 'px'); document.getElementById('val-glass-blur').innerText = e.target.value + 'px'; });
        inputs.edgeAlpha.addEventListener('input', (e) => { state[currentCard].edgeAlpha = e.target.value; updateCSSVar('edge-alpha', e.target.value / 100); document.getElementById('val-edge-alpha').innerText = e.target.value + '%'; });
        inputs.innerAlpha.addEventListener('input', (e) => { state[currentCard].innerAlpha = e.target.value; updateCSSVar('inner-alpha', e.target.value / 100); document.getElementById('val-inner-alpha').innerText = e.target.value + '%'; });
        inputs.glowAlpha.addEventListener('input', (e) => { state[currentCard].glowAlpha = e.target.value; updateCSSVar('glow-alpha', e.target.value / 100); document.getElementById('val-glow-alpha').innerText = e.target.value + '%'; });
        inputs.glowSpread.addEventListener('input', (e) => { state[currentCard].glowSpread = e.target.value; updateCSSVar('glow-spread', e.target.value, 'px'); document.getElementById('val-glow-spread').innerText = e.target.value + 'px'; });

    </script>
</body>
</html>
