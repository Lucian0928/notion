<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINANCE DASHBOARD - Premium Metal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    /* 完美的純黑背景，用來襯托金屬邊緣的反光 */
                    colors: { brand: '#FF7A00', darkBg: '#000000' }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            /* 數字金屬發光 */
            .text-glow {
                text-shadow: 0 0 10px rgba(255,255,255,0.3), 0 0 20px rgba(255,255,255,0.1);
            }

            /* 極致微弱的陽極氧化金屬顆粒感 (0.02 透明度) */
            .metal-grain::after {
                content: ""; position: absolute; inset: 0; border-radius: inherit;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
                opacity: 0.02; pointer-events: none; mix-blend-mode: overlay; z-index: 5;
            }

            /* =========================================
               🚀 THE METAL ENGINE (高級金屬渲染器)
               ========================================= */
            .card-metal {
                /* 1. 金屬本體：極深的霧面微光底色 */
                background: linear-gradient(145deg, #120A0D 0%, #050304 100%);
                border-radius: 24px; position: relative;
                
                /* 2. 物理厚度：只有極微弱的頂部內陰影與向下的純黑實體陰影，絕對不要往外散發彩色光暈！ */
                box-shadow: 
                    inset 0 1px 1px rgba(255, 255, 255, 0.05),
                    0 25px 50px -12px rgba(0, 0, 0, 1);
            }

            /* 3. 金屬表面漫射反光 (Surface Sheen) - 決定卡片的色調 */
            .card-metal-pink-sheen {
                position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
                /* 左上角的微弱粉紅金屬光澤 */
                background: radial-gradient(circle at 0% 0%, rgba(255, 43, 109, 0.12) 0%, transparent 60%);
            }
            .card-metal-orange-sheen {
                position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
                /* 左上角的微弱橘金金屬光澤 */
                background: radial-gradient(circle at 0% 0%, rgba(255, 122, 0, 0.12) 0%, transparent 60%);
            }

            /* 4. 頂級邊緣銳利高光 (Sharp Specular Rim Light) - 這是金屬高級感的靈魂！ */
            .card-metal-pink-rim::before {
                content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
                padding: 1px; /* 1px 銳利邊緣 */
                /* 從粉紅色過渡到微弱白色，再完全消失 */
                background: linear-gradient(135deg, rgba(255, 43, 109, 0.6) 0%, rgba(255, 255, 255, 0.1) 30%, transparent 70%);
                /* CSS 神級遮罩：掏空內部，只留下 padding 的 1px 邊線 */
                -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
                -webkit-mask-composite: xor; mask-composite: exclude;
            }
            .card-metal-orange-rim::before {
                content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
                padding: 1px;
                background: linear-gradient(135deg, rgba(255, 122, 0, 0.6) 0%, rgba(255, 255, 255, 0.1) 30%, transparent 70%);
                -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
                -webkit-mask-composite: xor; mask-composite: exclude;
            }
        }
    </style>
</head>
<body class="bg-darkBg text-gray-300 min-h-screen flex font-sans selection:bg-brand/30">

    <aside class="w-64 h-screen bg-darkBg border-r border-white/5 p-6 flex flex-col justify-between sticky top-0 shrink-0">
        <nav class="space-y-2 mt-4">
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-[#0A0A0A] text-brand border border-white/5 font-semibold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z"></path></svg>
                <span>Overview</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto relative">
        <div id="page-overview" class="max-w-5xl space-y-8 relative z-10">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-3xl font-bold text-white tracking-tight">Finance Overview</h1>
            </div>

            <section class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                
                <div class="card-metal card-metal-pink-rim metal-grain p-8 min-h-[240px] flex flex-col justify-between group transition-transform hover:-translate-y-1 duration-300">
                    <div class="card-metal-pink-sheen group-hover:opacity-80 transition-opacity duration-500"></div>
                    
                    <div class="relative z-10 h-full flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-sm font-semibold text-white/60 tracking-wider uppercase">Monthly Expense</span>
                            <div id="trend-icon"></div>
                        </div>
                        <div>
                            <div id="expense-amount" class="text-[56px] leading-none font-black text-white mb-3 tracking-tighter text-glow animate-pulse">Loading...</div>
                            <div id="mom-text" class="text-sm font-bold text-[#FF2B6D]">Calculating...</div>
                        </div>
                    </div>
                </div>

                <div class="card-metal card-metal-orange-rim metal-grain p-8 min-h-[240px] flex flex-col justify-between group transition-transform hover:-translate-y-1 duration-300">
                    <div class="card-metal-orange-sheen group-hover:opacity-80 transition-opacity duration-500"></div>
                    
                    <div class="relative z-10 h-full flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-sm font-semibold text-white/60 tracking-wider uppercase">Available Balance</span>
                            <svg class="w-6 h-6 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div>
                            <div id="balance-amount" class="text-[56px] leading-none font-black text-white mb-3 tracking-tighter text-glow animate-pulse">Loading...</div>
                            <div class="text-sm font-bold text-[#FF7A00] uppercase tracking-wider">Liquid Funds</div>
                        </div>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <script>
        async function fetchExpenseData() {
            const amountEl = document.getElementById('expense-amount');
            const momEl = document.getElementById('mom-text');
            const iconEl = document.getElementById('trend-icon');
            try {
                const res = await fetch('/api/get-expense');
                const data = await res.json();
                if (data.total !== undefined) {
                    amountEl.classList.remove('animate-pulse');
                    amountEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    momEl.classList.remove('animate-pulse');
                    const momVal = Math.abs(data.mom).toFixed(1);
                    if (data.mom > 0) {
                        momEl.innerText = `(+${momVal}% MoM)`; 
                        iconEl.innerHTML = `<svg class="w-6 h-6 text-[#FF2B6D]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>`;
                    } else {
                        momEl.innerText = `(-${momVal}% MoM)`; momEl.className = 'text-sm font-bold text-[#76A88A]';
                        iconEl.innerHTML = `<svg class="w-6 h-6 text-[#76A88A]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>`;
                    }
                }
            } catch (e) { amountEl.innerText = 'Error'; }
        }

        async function fetchBalanceData() {
            const balanceEl = document.getElementById('balance-amount');
            try {
                const res = await fetch('/api/get-balance');
                const data = await res.json();
                if (data.total !== undefined) {
                    balanceEl.classList.remove('animate-pulse');
                    balanceEl.innerText = '$' + data.total.toLocaleString('en-US', { minimumFractionDigits: 2 });
                } else { balanceEl.innerText = 'Error'; }
            } catch (e) { balanceEl.innerText = 'Error'; }
        }
        fetchExpenseData(); fetchBalanceData();
    </script>
</body>
</html>
