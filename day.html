<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Gold Counter</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@1&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 告訴瀏覽器這是一個深色網頁，避免給出預設白底 */
            color-scheme: dark; 
        }
        body {
            /* 關鍵：完全透明，不設任何底色 */
            background-color: transparent;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Cinzel', serif; /* 整體改用古典羅馬體，更霸氣 */
        }

        .container {
            text-align: center;
            /* 移除所有框線和背景，讓它「浮」在半空 */
            width: 100%;
            padding: 20px;
        }

        /* 頂部小標 Together For */
        .title {
            font-size: 0.85rem;
            letter-spacing: 6px; /* 字距拉超開，高級感 */
            text-transform: uppercase;
            color: #AA8E58; /* 比較暗沉的復古金 */
            margin-bottom: 5px;
            opacity: 0.8;
            font-weight: 400;
        }

        /* 核心數字：仿金屬光澤漸層 */
        .days-count {
            font-size: 6rem; /* 超大 */
            font-weight: 700;
            line-height: 1.1;
            margin: 0;
            
            /* 製作金屬反光效果 */
            background: linear-gradient(
                135deg, 
                #BF953F 0%, 
                #FCF6BA 40%, 
                #B38728 60%, 
                #FBF5B7 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* 加一點陰影讓它從背景跳出來 */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        /* 單位 Days */
        .unit {
            font-family: 'Lora', serif; /* 只有單位用草寫襯線體 */
            font-style: italic;
            font-size: 1.5rem;
            color: #C5A059;
            margin-top: -10px; /* 往上吸一點 */
            margin-bottom: 30px;
            opacity: 0.9;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        /* 分隔線：用最簡單的細線，不做作 */
        .divider {
            width: 40px;
            height: 1px;
            background-color: #AA8E58;
            margin: 0 auto 20px;
            opacity: 0.6;
            box-shadow: 0 0 5px rgba(197, 160, 89, 0.5);
        }

        /* 底部日期 */
        .date-start {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #8A6E3D;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">Together</div>
        <div class="days-count" id="days">0</div>
        <div class="unit">days</div>
        
        <div class="divider"></div>
        
        <div class="date-start" id="startDateDisplay">Since...</div>
    </div>

    <script>
        // 👇 紀念日 (2023-08-10)
        const YOUR_ANNIVERSARY = "2023-08-10"; 

        function updateCounter() {
            const start = new Date(YOUR_ANNIVERSARY);
            const now = new Date();
            const diffTime = Math.abs(now - start);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 

            document.getElementById('days').innerText = diffDays;
            
            // 日期格式化：AUG 10 . 2023
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            let dateStr = start.toLocaleDateString('en-US', options).toUpperCase();
            // 把逗號換成點，更有設計感
            dateStr = dateStr.replace(',', ' .'); 
            document.getElementById('startDateDisplay').innerText = "EST. " + dateStr;
        }

        updateCounter();
        setInterval(updateCounter, 1000 * 60 * 60);
    </script>
</body>
</html>
